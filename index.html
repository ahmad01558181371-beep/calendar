<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>التقويمان الميلادي والهجري</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2a26;--mu:#6b7a74;--ac:#0f7a5c;--ln:#e4e0d4;--tb:#e8f4ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#eaf0ed;--mu:#97a8a1;--ac:#3fc79c;--ln:#2b3833;--tb:#1f3a31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--tx:#eaf0ed;--mu:#97a8a1;--ac:#3fc79c;--ln:#2b3833;--tb:#1f3a31;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;padding:16px;max-width:520px;margin-inline:auto}
.today{background:var(--ac);color:#fff;border-radius:18px;padding:20px;text-align:center}
.today small{opacity:.85;font-size:14px}
.today .h{font-size:26px;font-weight:700;margin:6px 0 2px}
.today .g{font-size:17px;opacity:.95}
.nav{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.nav button{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer}
.nav .t{text-align:center}
.nav .t b{display:block;font-size:18px}
.nav .t span{font-size:13px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:8px}
.d{font-size:11px;color:var(--mu);text-align:center;padding:4px 0}
.c{aspect-ratio:1/1.1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.c b{font-size:16px}
.c i{font-style:normal;font-size:11px;color:var(--mu)}
.c.f b{color:var(--ac)}
.c.now{background:var(--ac)}
.c.now b,.c.now i{color:#fff}
.c.fri b{color:var(--ac)}
.go{display:block;margin:14px auto 0;background:var(--tb);color:var(--ac);border:0;border-radius:10px;padding:10px 20px;font-size:15px;cursor:pointer}
.note{font-size:12px;color:var(--mu);text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="today"><small id="wd"></small><div class="h" id="th"></div><div class="g" id="tg"></div></div>
<div class="nav"><button id="nx" aria-label="الشهر التالي">›</button><div class="t"><b id="mg"></b><span id="mh"></span></div><button id="pv" aria-label="الشهر السابق">‹</button></div>
<div class="grid" id="gr"></div>
<button class="go" id="gt">اليوم</button>
<p class="note">التقويم الهجري بحساب أم القرى، وقد يختلف يوماً عن إعلان دار الإفتاء حسب رؤية الهلال.</p>
<script>
var HJ="ar-EG-u-ca-islamic-umalqura-nu-latn",GR="ar-EG-u-ca-gregory-nu-latn";
function F(l,o,d){return new Intl.DateTimeFormat(l,o).format(d)}
function hd(d){return +F(HJ,{day:"numeric"},d)}
function hm(d){return F(HJ,{month:"long"},d)}
function hy(d){return F(HJ,{year:"numeric"},d).replace(/\D/g,"")}
var t=new Date(),cur=new Date(t.getFullYear(),t.getMonth(),1);
function same(a,b){return a.toDateString()===b.toDateString()}
function render(){
  var n=new Date();
  document.getElementById("wd").textContent=F(GR,{weekday:"long"},n);
  document.getElementById("th").textContent=hd(n)+" "+hm(n)+" "+hy(n)+"هـ";
  document.getElementById("tg").textContent=F(GR,{day:"numeric",month:"long",year:"numeric"},n)+"م";
  document.getElementById("mg").textContent=F(GR,{month:"long",year:"numeric"},cur)+"م";
  var last=new Date(cur.getFullYear(),cur.getMonth()+1,0),a=cur,b=last;
  var ma=hm(a)+" "+hy(a),mb=hm(b)+" "+hy(b);
  document.getElementById("mh").textContent=(ma===mb?ma:ma+" – "+mb)+"هـ";
  var g=document.getElementById("gr");g.innerHTML="";
  ["السبت","الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"].forEach(function(x){var e=document.createElement("div");e.className="d";e.textContent=x;g.appendChild(e)});
  var off=(cur.getDay()+1)%7,i;
  for(i=0;i<off;i++)g.appendChild(document.createElement("div"));
  for(i=1;i<=last.getDate();i++){
    var d=new Date(cur.getFullYear(),cur.getMonth(),i),h=hd(d),e=document.createElement("div");
    e.className="c"+(d.getDay()===5?" fri":"")+(h===1?" f":"")+(same(d,n)?" now":"");
    e.innerHTML="<b>"+i+"</b><i>"+(h===1?hm(d):h)+"</i>";
    g.appendChild(e);
  }
}
document.getElementById("nx").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
document.getElementById("pv").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
document.getElementById("gt").onclick=function(){var n=new Date();cur=new Date(n.getFullYear(),n.getMonth(),1);render()};
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
